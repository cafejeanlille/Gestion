<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeu de lumière — Café Jean</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeu Lumière">
<meta name="theme-color" content="#12100e">
<link rel="apple-touch-icon" href="/static/icon.png">
<link rel="icon" href="/static/icon.png">
<style>
  :root{
    --bg:#12100e; --panel:#1c1815; --bordeaux:#6d1f2a; --or:#c9a86a;
    --text:#f2ece2; --muted:#a89a8a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  .card{
    background:var(--panel); border:1px solid #2c2620; border-radius:14px;
    padding:28px; width:100%; max-width:420px; box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  h1{
    font-size:1.3rem; margin:0 0 4px; color:var(--or); letter-spacing:.02em;
  }
  .sub{color:var(--muted); font-size:.85rem; margin-bottom:20px;}
  button{
    font:inherit; cursor:pointer; border:none; border-radius:8px; padding:10px 14px;
  }
  #connect-btn{
    width:100%; background:var(--bordeaux); color:#fff; font-weight:600; margin-bottom:8px;
  }
  #day-mode-btn{
    width:100%; background:var(--or); color:#241f1a; font-weight:600; margin-bottom:16px;
  }
  #connect-btn:disabled, #day-mode-btn:disabled{opacity:.5; cursor:default;}
  .status{font-size:.85rem; color:var(--muted); margin-bottom:20px; min-height:1.2em;}
  .status.ok{color:#8fbf7f;}
  .status.err{color:#d97a6c;}
  fieldset{
    border:1px solid #2c2620; border-radius:10px; padding:14px; margin:0 0 16px;
  }
  legend{color:var(--or); font-size:.8rem; padding:0 6px;}
  .effects{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .effect-btn{
    background:#241f1a; color:var(--text); border:1px solid #362e26;
  }
  .effect-btn.active{background:var(--bordeaux); border-color:var(--bordeaux);}
  label{display:block; font-size:.8rem; color:var(--muted); margin:10px 0 4px;}
  input[type=range]{width:100%;}
  input[type=color]{width:100%; height:36px; border:none; border-radius:6px; background:none;}
  .row{display:flex; gap:10px;}
  .row button{flex:1;}
  #stop-btn{background:#3a2e26; color:var(--text);}
  #start-btn{background:var(--or); color:#241f1a; font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <h1>Jeu de lumière</h1>
  <div class="sub">Café Jean — ampoules Tapo</div>

  <button id="connect-btn">Se connecter aux ampoules</button>
  <button id="day-mode-btn" disabled>☀️ Mode journée</button>
  <div class="status" id="status"></div>

  <fieldset>
    <legend>Effet</legend>
    <div class="effects" id="effects"></div>
  </fieldset>

  <fieldset id="color-group">
    <legend>Couleur</legend>
    <input type="color" id="color" value="#8b1a2d">
  </fieldset>

  <fieldset id="speed-group" style="display:none">
    <legend>Vitesse</legend>
    <input type="range" id="speed" min="1" max="20" value="6">
  </fieldset>

  <div class="row">
    <button id="start-btn">Démarrer</button>
    <button id="stop-btn">Arrêter</button>
  </div>
</div>

<script>
const effects = {{ effects | tojson }};
const effectLabels = {statique: "Statique", arc_en_ciel: "Arc-en-ciel", strobe: "Strobe", son: "Réactif au son"};
const effectsEl = document.getElementById('effects');
let selectedEffect = 'statique';

effects.forEach(eff => {
  const btn = document.createElement('button');
  btn.className = 'effect-btn' + (eff === selectedEffect ? ' active' : '');
  btn.textContent = effectLabels[eff] || eff;
  btn.onclick = () => {
    selectedEffect = eff;
    document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('color-group').style.display = (eff === 'son' || eff === 'arc_en_ciel') ? 'none' : '';
    document.getElementById('speed-group').style.display = (eff === 'arc_en_ciel' || eff === 'strobe') ? '' : 'none';
  };
  effectsEl.appendChild(btn);
});

function setStatus(msg, kind){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function hexToHsv(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
  let h = 0;
  if(d !== 0){
    if(max === r) h = ((g-b)/d) % 6;
    else if(max === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if(h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d/max;
  return [Math.round(h), Math.round(s*100), Math.round(max*100)];
}

document.getElementById('connect-btn').onclick = async () => {
  const btn = document.getElementById('connect-btn');
  btn.disabled = true;
  setStatus('Connexion en cours…');
  try{
    const res = await fetch('/api/connect', {method:'POST'});
    const data = await res.json();
    if(data.ok){
      setStatus(`${data.bulbs} ampoule(s) connectée(s)`, 'ok');
      document.getElementById('day-mode-btn').disabled = false;
    } else {
      setStatus(data.error, 'err');
    }
  } catch(e){
    setStatus('Erreur: ' + e, 'err');
  }
  btn.disabled = false;
};

async function autoConnect(){
  const btn = document.getElementById('connect-btn');
  btn.disabled = true;
  setStatus('Connexion automatique en cours…');
  try{
    const res = await fetch('/api/connect', {method:'POST'});
    const data = await res.json();
    if(data.ok){
      setStatus(`${data.bulbs} ampoule(s) connectée(s)`, 'ok');
      document.getElementById('day-mode-btn').disabled = false;
    } else {
      setStatus(data.error, 'err');
    }
  } catch(e){
    setStatus('Erreur: ' + e, 'err');
  }
  btn.disabled = false;
}
autoConnect();

document.getElementById('day-mode-btn').onclick = async () => {
  const btn = document.getElementById('day-mode-btn');
  btn.disabled = true;
  setStatus('Retour au mode journée…');
  try{
    const res = await fetch('/api/day_mode', {method:'POST'});
    const data = await res.json();
    setStatus(data.ok ? 'Mode journée rétabli' : data.error, data.ok ? 'ok' : 'err');
  } catch(e){
    setStatus('Erreur: ' + e, 'err');
  }
  btn.disabled = false;
};

document.getElementById('start-btn').onclick = async () => {
  const params = {};
  if(selectedEffect === 'son'){
    params.hue = hexToHsv(document.getElementById('color').value)[0];
  } else if(selectedEffect !== 'arc_en_ciel'){
    params.color = hexToHsv(document.getElementById('color').value);
  }
  if(selectedEffect === 'arc_en_ciel' || selectedEffect === 'strobe'){
    params.speed = Number(document.getElementById('speed').value);
    if(selectedEffect === 'strobe') params.color = hexToHsv(document.getElementById('color').value);
  }
  try{
    const res = await fetch('/api/start', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({effect: selectedEffect, params})
    });
    const data = await res.json();
    setStatus(data.ok ? `Effet "${effectLabels[selectedEffect]}" lancé` : data.error, data.ok ? 'ok' : 'err');
  } catch(e){
    setStatus('Erreur: ' + e, 'err');
  }
};

document.getElementById('stop-btn').onclick = async () => {
  const res = await fetch('/api/stop', {method:'POST'});
  const data = await res.json();
  setStatus(data.ok ? 'Arrêté' : data.error, data.ok ? 'ok' : 'err');
};
</script>
</body>
</html>
