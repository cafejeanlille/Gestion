<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeu de lumière — Café Jean</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeu Lumière">
<meta name="theme-color" content="#12100e">
<link rel="apple-touch-icon" href="/static/icon.png">
<link rel="icon" href="/static/icon.png">
<style>
  :root{
    --bg:#12100e; --panel:#1c1815; --bordeaux:#6d1f2a; --or:#c9a86a;
    --text:#f2ece2; --muted:#a89a8a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  .card{
    background:var(--panel); border:1px solid #2c2620; border-radius:14px;
    padding:28px; width:100%; max-width:420px; box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  h1{
    font-size:1.3rem; margin:0 0 4px; color:var(--or); letter-spacing:.02em;
  }
  .sub{color:var(--muted); font-size:.85rem; margin-bottom:20px;}
  button{
    font:inherit; cursor:pointer; border:none; border-radius:8px; padding:10px 14px;
  }
  #connect-btn{
    width:100%; background:var(--bordeaux); color:#fff; font-weight:600; margin-bottom:8px;
  }
  #day-mode-btn{
    width:100%; background:var(--or); color:#241f1a; font-weight:600; margin-bottom:16px;
  }
  #connect-btn:disabled, #day-mode-btn:disabled{opacity:.5; cursor:default;}
  .status{font-size:.85rem; color:var(--muted); margin-bottom:20px; min-height:1.2em;}
  .status.ok{color:#8fbf7f;}
  .status.err{color:#d97a6c;}
  fieldset{
    border:1px solid #2c2620; border-radius:10px; padding:14px; margin:0 0 16px;
  }
  legend{color:var(--or); font-size:.8rem; padding:0 6px;}
  .effects{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .effect-btn{
    background:#241f1a; color:var(--text); border:1px solid #362e26;
  }
  .effect-btn.active{background:var(--bordeaux); border-color:var(--bordeaux);}
  label{display:block; font-size:.8rem; color:var(--muted); margin:10px 0 4px;}
  input[type=range]{width:100%;}
  input[type=color]{width:100%; height:36px; border:none; border-radius:6px; background:none;}
  .row{display:flex; gap:10px;}
  .row button{flex:1;}
  #stop-btn{background:#3a2e26; color:var(--text);}
  #start-btn{background:var(--or); color:#241f1a; font-weight:600;}
  .secteur{
    border:1px solid #2c2620; border-radius:10px; margin-bottom:10px; overflow:hidden;
  }
  .secteur-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 12px; background:#241f1a; cursor:pointer; font-weight:600; font-size:.85rem;
  }
  .secteur-header .chevron{ transition:transform 0.2s ease; color:var(--muted); font-size:.7rem; }
  .secteur.open .secteur-header .chevron{ transform:rotate(180deg); }
  .secteur-corps{ display:none; }
  .secteur.open .secteur-corps{ display:block; }
  .secteur-brightness{ padding:10px 12px 4px; border-top:1px solid #2c2620; }
  .secteur-brightness label{ margin:0 0 6px; }
  .ampoule-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 12px; border-top:1px solid #2c2620; font-size:.85rem;
  }
  .ampoule-row.disabled{ opacity:.5; }
  .toggle{ position:relative; display:inline-block; width:36px; height:21px; flex-shrink:0; }
  .toggle input{ opacity:0; width:0; height:0; }
  .toggle .track{
    position:absolute; inset:0; background:#3a332c; border-radius:21px; transition:background 0.2s ease;
  }
  .toggle .track::before{
    content:''; position:absolute; width:15px; height:15px; left:3px; top:3px;
    background:var(--text); border-radius:50%; transition:transform 0.2s ease;
  }
  .toggle input:checked + .track{ background:var(--bordeaux); }
  .toggle input:checked + .track::before{ transform:translateX(15px); }
</style>
</head>
<body>
<div class="card">
  <h1>Jeu de lumière</h1>
  <div class="sub">Café Jean — ampoules Tapo</div>

  <button id="connect-btn">Se connecter aux ampoules</button>
  <button id="day-mode-btn" disabled>☀️ Mode journée</button>
  <div class="status" id="status"></div>
  <div id="secteurs"></div>

  <fieldset>
    <legend>Effet</legend>
    <div class="effects" id="effects"></div>
  </fieldset>

  <fieldset id="color-group">
    <legend>Couleur</legend>
    <input type="color" id="color" value="#8b1a2d">
  </fieldset>

  <fieldset id="speed-group" style="display:none">
    <legend>Vitesse</legend>
    <input type="range" id="speed" min="1" max="20" value="6">
  </fieldset>

  <div class="row">
    <button id="start-btn">Démarrer</button>
    <button id="stop-btn">Arrêter</button>
  </div>
</div>

<script>
const effects = {{ effects | tojson }};
const effectLabels = {statique: "Statique", arc_en_ciel: "Arc-en-ciel", strobe: "Strobe", son: "Réactif au son"};
const effectsEl = document.getElementById('effects');
let selectedEffect = 'statique';

effects.forEach(eff => {
  const btn = document.createElement('button');
  btn.className = 'effect-btn' + (eff === selectedEffect ? ' active' : '');
  btn.textContent = effectLabels[eff] || eff;
  btn.onclick = () => {
    selectedEffect = eff;
    document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('color-group').style.display = (eff === 'son' || eff === 'arc_en_ciel') ? 'none' : '';
    document.getElementById('speed-group').style.display = (eff === 'arc_en_ciel' || eff === 'strobe') ? '' : 'none';
  };
  effectsEl.appendChild(btn);
});

function setStatus(msg, kind){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function hexToHsv(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
  let h = 0;
  if(d !== 0){
    if(max === r) h = ((g-b)/d) % 6;
    else if(max === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if(h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d/max;
  return [Math.round(h), Math.round(s*100), Math.round(max*100)];
}

function renderSecteurs(bulbList){
  const conteneur = document.getElementById('secteurs');
  if(!conteneur) return;
  const secteursOuverts = new Set(
    Array.from(conteneur.querySelectorAll('.secteur.open')).map(el => el.dataset.secteur)
  );
  const intensites = {};
  conteneur.querySelectorAll('.secteur').forEach(el => {
    const input = el.querySelector('.secteur-brightness input');
    if(input) intensites[el.dataset.secteur] = input.value;
  });
  if(!bulbList || !bulbList.length){ conteneur.innerHTML = ''; return; }
  const secteurs = {};
  bulbList.forEach(b => { (secteurs[b.secteur] = secteurs[b.secteur] || []).push(b); });
  conteneur.innerHTML = Object.keys(secteurs).sort().map(secteur => {
    const ampoules = secteurs[secteur];
    const actives = ampoules.filter(a => a.enabled).length;
    const lignes = ampoules.map(a => `
      <div class="ampoule-row${a.enabled ? '' : ' disabled'}">
        <span>${a.name}</span>
        <label class="toggle">
          <input type="checkbox" ${a.enabled ? 'checked' : ''} onclick="event.stopPropagation(); toggleAmpoule('${a.ip}', this.checked)">
          <span class="track"></span>
        </label>
      </div>`).join('');
    const ouvert = secteursOuverts.has(secteur) ? ' open' : '';
    const toutActif = actives === ampoules.length;
    const intensite = intensites[secteur] || 100;
    return `
      <div class="secteur${ouvert}" data-secteur="${secteur}">
        <div class="secteur-header" onclick="this.parentElement.classList.toggle('open')">
          <span>${secteur} (${actives}/${ampoules.length})</span>
          <label class="toggle" onclick="event.stopPropagation()">
            <input type="checkbox" ${toutActif ? 'checked' : ''} onclick="toggleSecteur('${secteur}', this.checked)">
            <span class="track"></span>
          </label>
          <span class="chevron">▾</span>
        </div>
        <div class="secteur-corps">
          <div class="secteur-brightness" onclick="event.stopPropagation()">
            <label>Intensité</label>
            <input type="range" min="1" max="100" value="${intensite}" onchange="setSecteurBrightness('${secteur}', this.value)">
          </div>
          ${lignes}
        </div>
      </div>`;
  }).join('');
}

async function api(url, body){
  try{
    const res = await fetch(url, body === undefined
      ? {method:'POST'}
      : {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    return await res.json();
  } catch(e){
    return {ok:false, error:'Erreur: ' + e};
  }
}

async function toggleAmpoule(ip, enabled){
  const data = await api('/api/toggle_bulb', {ip, enabled});
  if(data.ok){ renderSecteurs(data.bulb_list); } else { setStatus(data.error, 'err'); }
}

async function toggleSecteur(secteur, enabled){
  const data = await api('/api/toggle_secteur', {secteur, enabled});
  if(data.ok){ renderSecteurs(data.bulb_list); } else { setStatus(data.error, 'err'); }
}

async function setSecteurBrightness(secteur, brightness){
  const data = await api('/api/set_secteur_brightness', {secteur, brightness: Number(brightness)});
  if(!data.ok){ setStatus(data.error, 'err'); }
}

async function connecter(auto){
  const btn = document.getElementById('connect-btn');
  btn.disabled = true;
  setStatus(auto ? 'Connexion automatique en cours…' : 'Connexion en cours…');
  const data = await api('/api/connect');
  if(data.ok){
    setStatus(`${data.bulbs} ampoule(s) connectée(s)`, 'ok');
    document.getElementById('day-mode-btn').disabled = false;
    renderSecteurs(data.bulb_list);
  } else {
    setStatus(data.error, 'err');
  }
  btn.disabled = false;
}

document.getElementById('connect-btn').onclick = () => connecter(false);
connecter(true);

document.getElementById('day-mode-btn').onclick = async () => {
  const btn = document.getElementById('day-mode-btn');
  btn.disabled = true;
  setStatus('Retour au mode journée…');
  const data = await api('/api/day_mode');
  setStatus(data.ok ? 'Mode journée rétabli' : data.error, data.ok ? 'ok' : 'err');
  btn.disabled = false;
};

document.getElementById('start-btn').onclick = async () => {
  const params = {};
  if(selectedEffect !== 'arc_en_ciel' && selectedEffect !== 'son'){
    params.color = hexToHsv(document.getElementById('color').value);
  }
  if(selectedEffect === 'arc_en_ciel' || selectedEffect === 'strobe'){
    params.speed = Number(document.getElementById('speed').value);
    if(selectedEffect === 'strobe') params.color = hexToHsv(document.getElementById('color').value);
  }
  const data = await api('/api/start', {effect: selectedEffect, params});
  setStatus(data.ok ? `Effet "${effectLabels[selectedEffect]}" lancé` : data.error, data.ok ? 'ok' : 'err');
};

document.getElementById('stop-btn').onclick = async () => {
  const data = await api('/api/stop');
  setStatus(data.ok ? 'Arrêté' : data.error, data.ok ? 'ok' : 'err');
};
</script>
</body>
</html>
